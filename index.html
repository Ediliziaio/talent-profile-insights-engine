      <h1>Talenti Edili — selezione del personale edile con Intelligenza Artificiale e analisi psicoattitudinale</h1>
      <p>
        Talenti Edili è il portale che aiuta le imprese edili italiane a scegliere le persone giuste per il cantiere.
        Si basa sul Talent Profile System: un'analisi psicoattitudinale di 242 domande che misura 15 tratti della
        persona, elaborata dall'Intelligenza Artificiale in un report con compatibilità di ruolo, rischi
        comportamentali, guida al colloquio e piano di inserimento a 90 giorni.
      </p>
      <h2>I tre modi di usarlo</h2>
      <ul>
        <li><a href="/piattaforma">piattaforma</a> — cerca fra profili edili già analizzati, ordinati per compatibilità con il ruolo.</li>
        <li><a href="/ricerca-e-selezione-personale-edile">Ricerca e selezione</a> — la selezione la facciamo noi: rosa di 3 finalisti con report completo in 21 giorni.</li>
        <li><a href="/talent-profile-system">Talent Profile System</a> — usa il sistema di analisi in autonomia sui tuoi candidati.</li>
      </ul>
